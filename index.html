<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Гладкова. Программка</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Программка">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root{--rasp:#D6105E;--sky:#BFDFFF;--ink:#14121a}
  html,body{margin:0;height:100%;background:#fff;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;text-align:center}
  .mark{width:72px;height:72px;border-radius:18px;background:var(--rasp);color:#fff;display:grid;place-items:center;font:700 40px/1 Georgia,"Times New Roman",serif;box-shadow:6px 6px 0 var(--sky)}
  h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:22px 0 6px}
  p{margin:0;max-width:320px;color:#55505e}
  .dots{display:flex;gap:6px;margin-top:18px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--rasp);animation:b 1s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.15s;background:var(--sky)}
  .dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
  button{margin-top:18px;font:600 16px/1 inherit;padding:14px 22px;border-radius:12px;border:2px solid var(--ink);background:var(--sky);color:var(--ink)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">Г</div>
  <h1 id="t">Открываю программку…</h1>
  <p id="m"></p>
  <div class="dots" id="d"><i></i><i></i><i></i></div>
  <button id="r" hidden onclick="location.reload()">Обновить</button>
</div>
<script>
(function(){
  var WRAPS=[["zrh0sXuZwDu+AFIp", "Taq7QtWfk5tvnlRtxHMSpZ4mllfoVfQfbVYTY392e3LqjOIpRP5lOk4MTnt8KAeF"], ["IhcY81t08BiNCW/R", "EsFngSp+hwZD56RKrjQYSKd1vGm0F8SloBxqjm88a8oH902na0VB06Rgzf+p1Y0r"]], API="https://script.google.com/macros/s/AKfycbx2KlSO4JTahtWNgQxWKSTSfmLeORUUMLOCfR0g3mfOZOsO5bbRm6hjMO1L2y89Xwq6/exec", VER='20261028175409';
  function say(t,m,btn){document.getElementById('t').textContent=t;document.getElementById('m').textContent=m||'';document.getElementById('d').hidden=true;document.getElementById('r').hidden=!btn}
  var k=null;try{k=new URLSearchParams(location.search).get('k')}catch(e){}
  try{if(k)localStorage.setItem('gk',k);else k=localStorage.getItem('gk')}catch(e){}
  if(!k){say('Программка открывается по личной ссылке','Открой ссылку, которую прислала Кристина, — дальше вход сохранится.');return}
  if(!window.crypto||!crypto.subtle){say('Браузер устарел','Открой программку в Safari или Chrome.');return}
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var enc=new TextEncoder();
  crypto.subtle.digest('SHA-256',enc.encode('gladkova:'+k))
    .then(function(h){return crypto.subtle.importKey('raw',h,'AES-GCM',false,['decrypt'])})
    .then(function(kk){
      var i=0;
      function next(){if(i>=WRAPS.length)return Promise.reject('key');var w=WRAPS[i++];
        return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w[0])},kk,b64(w[1])).catch(next)}
      return next()})
    .then(function(ck){return crypto.subtle.importKey('raw',ck,'AES-GCM',false,['decrypt'])})
    .then(function(ck){
      return fetch('app.bin?v='+VER).then(function(r){if(!r.ok)throw 'net';return r.arrayBuffer()}).then(function(buf){
        var u=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},ck,u.slice(12))})})
    .then(function(plain){
      var html=new TextDecoder().decode(plain).replace('"__GAPI__"',JSON.stringify(API)).replace('"__GKEY__"',JSON.stringify(k));
      document.open();document.write(html);document.close()})
    .catch(function(e){
      if(e==='key'){try{localStorage.removeItem('gk')}catch(x){}say('Ссылка не подходит','Попроси у Кристины свежую ссылку на программку.');return}
      say('Не получилось загрузить','Проверь интернет и нажми «Обновить». Если не поможет — включи VPN.',true)})
})();
</script>
</body>
</html>
